#cloud-config

write_files:

- path: /opt/app/server.py
  permissions: "0755"
  content: |

    from http.server import HTTPServer, BaseHTTPRequestHandler
    import socket

    class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
        if self.path == "/health":
          self.send_response(200)
          self.end_headers()
          self.wfile.write(b"healthy")
        else:
          self.send_response(200)
          self.end_headers()
          self.wfile.write(socket.gethostname().encode())

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

- path: /etc/systemd/system/webapp.service
  content: |
    [Unit]
    Description=Python web service

    [Service]
    ExecStart=/usr/bin/python3 /opt/app/server.py 
    Restart=always

    [Install]
    WantedBy=multi-user.target

runcmd:
  - systemctl enable --now webapp